---
- name: Display Service Being Evaluated
  debug:
    msg:
      - "Target Host: {{ inventory_hostname }}"
      - "Target Service: {{ target_service_name }}"

- name: Check Service Status
  ansible.windows.win_service_info:
    name: "{{ target_service_name }}"
  register: service_info

  - name: Verify Service Exists
  fail:
    msg: "Service '{{ target_service_name }}' was not found on {{ inventory_hostname }}"
  when: service_info.services | length == 0

- name: Save Initial Service State
  set_fact:
    service_state_before: "{{ service_info.services[0].state }}"

- name: Display Service Status
  debug:
    msg:
      - "Service: {{ target_service_name }}"
      - "State Before Recovery: {{ service_state_before }}"
