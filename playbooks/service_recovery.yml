---
- name: Self-Healing Service Recovery
  hosts: "{{ target_host | default('windows') }}"
  gather_facts: yes

  tasks:

    - name: Initialize Recovery Summary
      set_fact:
        recovery_summary: []

    - name: Process Services
      include_tasks: service_workflow.yml
      loop: "{{ services }}"
      loop_control:
        loop_var: current_service

    - name: Display Consolidated Recovery Summary
      debug:
        msg: |
		   ===============================================
		   MULTI-SERVICE SELF-HEALING SUMMARY
		   ===============================================

			{% for svc in recovery_summary %}
			 Service : {{ svc.service }}
			 Before  : {{ svc.before }}
			 After   : {{ svc.after }}
			 Attempts: {{ svc.attempts }}
			 Status  : {{ svc.status }}
		     -----------------------------------------------
			 {% endfor %}
			
			 Total Services : {{ recovery_summary | length }}
			 Auto-Recovered : {{ recovery_summary | selectattr('status','equalto','AUTO-RECOVERED') | list | length }}
			 Failed         : {{ recovery_summary | rejectattr('status','equalto','AUTO-RECOVERED') | list | length }}
			
			 Overall Status : {{
			        'SUCCESS'
			        if (recovery_summary | rejectattr('status','equalto','AUTO-RECOVERED') | list | length) == 0
			        else 'PARTIAL FAILURE'
			      }}
			
			 ===============================================

    
