---
- name: Self-Healing Service Recovery
  hosts: "{{ target_host | default('windows') }}"
  gather_facts: yes

  vars:
    max_restart_attempts: 3
    validation_type: "{{ validation_type | default('service') }}"
    validation_port: "{{ validation_port | default(80) }}"
    target_service_name: "{{ target_services}}"

  tasks:
    - name: Process Services
      include_tasks: service_workflow.yml
      loop: "{{ target_service_name}}"
      loop_control:
        loop_var: current_service
  
    - include_tasks: remediate_service.yml
    - include_tasks: validate.yml
