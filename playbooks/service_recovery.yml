---
- name: Self-Healing Service Recovery
  hosts: "{{ target_host | default('windows') }}"
  gather_facts: yes

  tasks:

  - name: Initialize Recovery Summary
    set_fact:
      recovery_summary: []

  - name: Process Services
    include_tasks: service_workflow.yml
    loop: "{{ services }}"
      loop_control:
        loop_var: current_service
