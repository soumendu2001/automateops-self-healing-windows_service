---
- name: Display Restart Attempt
  debug:
    msg: "Restart Attempt {{ attempt_no }}"

- name: Update Attempt Counter
  set_fact:
    recovery_attempt_count: "{{ attempt_no }}"

#############################################################################
# Protected Services
#############################################################################

- name: Define Protected Services
  set_fact:
    protected_services:
      - EventLog
      - RpcSs
      - DcomLaunch
      - SamSs
      - LSM
      - Winmgmt
      - LanmanServer
      - LanmanWorkstation
      - MpsSvc
      - TermService
      - WinRM
      - Dhcp
      - Dnscache
      - Netlogon
      - Schedule
      - PlugPlay
      - CryptSvc
      - NlaSvc
      - BFE
      - W32Time

#############################################################################
# Service Validation
#############################################################################

- name: Collect Service Information
  ansible.windows.win_service_info:
    name: "{{ target_service_name }}"
  register: service_info

- name: Validate Service Exists
  fail:
    msg: "Service {{ target_service_name }} does not exist."
  when:
    - service_info.services | length == 0

- name: Display Service Details
  debug:
    msg:
      - "Target Service : {{ target_service_name }}"
      - "Current State  : {{ service_info.services[0].state }}"
      - "Start Mode     : {{ service_info.services[0].start_mode }}"

- name: Block Restart of Protected Services
  fail:
    msg: >
      Service {{ target_service_name }}
      is a protected Windows service and is excluded from
      automated remediation.
  when:
    - target_service_name in protected_services

#############################################################################
# Restart Service
#############################################################################

- name: Restart Target Service
  ansible.windows.win_service:
    name: "{{ target_service_name }}"
    state: restarted
  register: service_restart

- name: Display Restart Result
  debug:
    msg:
      - "Restart command executed"
      - "Target Service: {{ target_service_name }}"
      - "Changed: {{ service_restart.changed }}"

#############################################################################
# Stabilization Wait
#############################################################################

- name: Wait For Stabilization
  pause:
    seconds: 10

#############################################################################
# Validation After Restart
#############################################################################

- name: Check Service Status Again
  ansible.windows.win_service_info:
    name: "{{ target_service_name }}"
  register: service_recheck

- name: Update Current State
  set_fact:
    service_current_state: "{{ service_recheck.services[0].state }}"

- name: Display Current State
  debug:
    msg: "Current State: {{ service_current_state }}"

#############################################################################
# Recovery Status
#############################################################################

- name: Mark Recovery Successful
  set_fact:
    recovery_complete: true
  when:
    - service_current_state == "started"

- name: Fail Recovery If Service Is Still Down
  fail:
    msg: >
      Service {{ target_service_name }}
      remains in state {{ service_current_state }}
      after restart attempt {{ attempt_no }}.
  when:
    - service_current_state != "started"

- name: Display Recovery Success
  debug:
    msg: >
      Service {{ target_service_name }}
      successfully recovered during attempt
      {{ attempt_no }}.
  when:
    - recovery_complete | default(false)
